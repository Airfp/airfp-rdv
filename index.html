<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Air-FP">
<meta name="theme-color" content="#0f172a">
<title>Air-FP — Confirmation RDV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface2: #293548;
  --border: #334155;
  --accent: #38bdf8;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --danger: #f87171;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 16px; }
body { padding-bottom: 50px; }

.header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 16px 20px 14px; position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 12px;
}
.logo {
  width: 36px; height: 36px; background: var(--accent); border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 600; color: #0f172a; flex-shrink: 0;
}
.header-text h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
.header-text p { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

.content { padding: 20px 16px; max-width: 480px; margin: 0 auto; }

.section-label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-dim); margin: 24px 0 10px;
}
.section-label:first-child { margin-top: 0; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

.field { display: flex; flex-direction: column; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.field:last-child { border-bottom: none; }
.field label { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-bottom: 5px; letter-spacing: 0.02em; }
.field input, .field select {
  background: transparent; border: none; outline: none;
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; width: 100%;
  -webkit-appearance: none; appearance: none;
}
.field input::placeholder { color: var(--text-dim); }
.field select option { background: #1e293b; color: var(--text); }
.field select.empty { color: var(--text-dim); }

.row3 { display: grid; grid-template-columns: 2fr 1fr 1fr; }
.row3 .field { border-right: 1px solid var(--border); border-bottom: none; }
.row3 .field:last-child { border-right: none; }

.svc-list { display: flex; flex-direction: column; gap: 10px; }
.svc-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

.svc-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.svc-top select {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
  -webkit-appearance: none; appearance: none;
}
.svc-top select option { background: #1e293b; }
.svc-top select.empty { color: var(--text-dim); }

.svc-custom-name {
  width: 100%; background: transparent; border: none; outline: none;
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
  padding: 12px 14px; border-bottom: 1px solid var(--border);
}
.svc-custom-name::placeholder { color: var(--text-dim); }

.rm-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 22px; line-height: 1; padding: 2px; flex-shrink: 0; }
.rm-btn:active { color: var(--danger); }

.svc-bottom { display: grid; grid-template-columns: 1fr 1fr 1fr; }
.svc-field { display: flex; flex-direction: column; padding: 10px 12px; border-right: 1px solid var(--border); }
.svc-field:last-child { border-right: none; }
.svc-field label { font-size: 10px; color: var(--text-dim); font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 4px; }
.svc-field input {
  background: transparent; border: none; outline: none;
  color: var(--text); font-family: 'DM Mono', monospace; font-size: 14px; width: 100%;
  -webkit-appearance: none;
}
.svc-field input::placeholder { color: var(--text-dim); }
.svc-field input:disabled { color: var(--text-dim); }

.indeter-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
.indeter-row input[type=checkbox] { accent-color: var(--accent); width: 18px; height: 18px; flex-shrink: 0; }
.indeter-row span { font-size: 13px; color: var(--text-muted); }

.add-btn {
  width: 100%; background: var(--surface); border: 1px dashed var(--border);
  border-radius: var(--radius); padding: 14px; color: var(--text-muted);
  font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px;
}
.add-btn:active { background: var(--surface2); }

.summary {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px; margin-top: 10px;
  display: flex; justify-content: space-between; align-items: center;
}
.summary-item { display: flex; flex-direction: column; gap: 3px; }
.summary-item span:first-child { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
.summary-item span:last-child { font-size: 16px; font-weight: 600; font-family: 'DM Mono', monospace; color: var(--accent); }
.summary-divider { width: 1px; height: 30px; background: var(--border); }

.send-btn {
  width: 100%; margin-top: 28px; padding: 16px; background: var(--accent);
  border: none; border-radius: var(--radius); color: #0f172a;
  font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.send-btn:active { opacity: 0.85; }
.err-msg { font-size: 13px; color: var(--danger); margin-top: 12px; text-align: center; display: none; }

.search-row { display: flex; align-items: center; gap: 8px; padding: 12px 14px; }
.search-row input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; width: 100%;
  -webkit-appearance: none; appearance: none;
}
.search-row input::placeholder { color: var(--text-dim); }
.search-btn {
  flex-shrink: 0; background: var(--accent); border: none; border-radius: 8px;
  padding: 9px 14px; color: #0f172a; font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 600; cursor: pointer;
}
.search-btn:active { opacity: 0.85; }
.search-results { margin-top: 8px; }
.result-item { padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
.result-item:last-child { border-bottom: none; }
.result-item:active { background: var(--surface2); }
.result-nom { font-size: 14px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; }
.result-detail { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.result-msg { padding: 14px; text-align: center; color: var(--text-dim); font-size: 13px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">AF</div>
  <div class="header-text">
    <h1>Air-FP</h1>
    <p>Confirmation de rendez-vous</p>
  </div>
</div>

<div class="content">

  <p class="section-label">Rechercher un client existant</p>
  <div class="card">
    <div class="search-row">
      <input type="text" id="recherche-client" placeholder="Nom, téléphone ou courriel..." autocomplete="off"
        onkeydown="if(event.key==='Enter'){event.preventDefault();rechercherClient();}">
      <button type="button" class="search-btn" onclick="rechercherClient()">Rechercher</button>
    </div>
  </div>
  <div class="search-results" id="resultats-recherche" style="display:none"></div>

  <p class="section-label">Client</p>
  <div class="card">
    <div class="field"><label>Prénom et nom *</label><input type="text" id="nom" placeholder="ex: Émilie David" autocomplete="off"></div>
    <div class="field"><label>Téléphone *</label><input type="tel" id="tel" placeholder="ex: 819-208-9149" autocomplete="off"></div>
    <div class="field"><label>Courriel *</label><input type="email" id="courriel" placeholder="ex: client@hotmail.com" autocomplete="off"></div>
    <div class="field"><label>Adresse complète *</label><input type="text" id="adresse" placeholder="ex: 23 chemin des renards blancs, L'Ange-Gardien" autocomplete="off"></div>
  </div>

  <p class="section-label">Date et heure *</p>
  <div class="card">
    <div class="row3">
      <div class="field">
        <label>Jour</label>
        <select id="sel-jour" class="empty" onchange="this.classList.remove('empty')">
          <option value="" disabled selected>Choisir...</option>
        </select>
      </div>
      <div class="field">
        <label>Heure</label>
        <select id="sel-heure" class="empty" onchange="this.classList.remove('empty')">
          <option value="" disabled selected>—</option>
        </select>
      </div>
      <div class="field">
        <label>Minute</label>
        <select id="sel-min" class="empty" onchange="this.classList.remove('empty')">
          <option value="" disabled selected>—</option>
        </select>
      </div>
    </div>
  </div>

  <p class="section-label">Services *</p>
  <div class="svc-list" id="svc-list"></div>
  <button class="add-btn" onclick="addSvc()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Ajouter un service
  </button>

  <div class="summary" id="summary" style="display:none">
    <div class="summary-item"><span>Durée totale</span><span id="dur-val">—</span></div>
    <div class="summary-divider"></div>
    <div class="summary-item"><span>Total estimé</span><span id="total-val">—</span></div>
  </div>

  <p class="section-label">Notes (optionnel)</p>
  <div class="card">
    <div class="field">
      <label>Pour le technicien / le calendrier</label>
      <textarea id="notes-tech" rows="3" placeholder="ex: chien dans la cour, entrer par le garage, prix négocié..."
        style="background:transparent;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;width:100%;resize:vertical;"></textarea>
    </div>
  </div>

  <div class="err-msg" id="val-msg">Veuillez remplir tous les champs obligatoires (*).</div>

  <button class="send-btn" id="send-btn" onclick="envoyer()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    Envoyer la confirmation
  </button>

</div>

<script>
const JOURS_FR = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS_FR  = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

const WEBHOOK_URL = 'https://hook.us2.make.com/cq70a7dh5a8g5hdhltwuyf6tf4v06gtc';

// Enregistrement dans Supabase — même base de données que le site de
// réservation en ligne et l'app technicien, pour que ce rendez-vous confirmé
// manuellement apparaisse dans les disponibilités et le calendrier technicien,
// et pour empêcher un double-book sur une van déjà occupée à cette heure.
const SUPABASE_URL = 'https://hlcvuhwqlqytmnleqgqw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsY3Z1aHdxbHF5dG1ubGVxZ3F3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NDA3NjAsImV4cCI6MjEwMDMxNjc2MH0.vli-DqA-nNXdRos3fr9jQINoPvlcE4Ca0dJoV_oUQO4';

function initSelects() {
  const selJour = document.getElementById('sel-jour');
  const selH    = document.getElementById('sel-heure');
  const selM    = document.getElementById('sel-min');

  const today = new Date();
  for (let i = 0; i <= 60; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    const dow   = JOURS_FR[d.getDay()];
    const label = dow.charAt(0).toUpperCase()+dow.slice(1)+' '+d.getDate()+' '+MOIS_FR[d.getMonth()];
    const val   = d.toISOString().split('T')[0];
    selJour.appendChild(new Option(label, val));
  }

  for (let h = 8; h <= 17; h++) {
    selH.appendChild(new Option(h+'h00', String(h).padStart(2,'0')));
  }

  ['00','15','30','45'].forEach(m => selM.appendChild(new Option(':'+m, m)));
}

let rows = [];
let CATALOGUE = []; // chargé depuis Supabase (liste officielle des services actifs)
let derniersResultats = []; // dernière recherche de client (pour l'autofill)

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function rechercherClient() {
  const terme = document.getElementById('recherche-client').value.trim();
  const box   = document.getElementById('resultats-recherche');

  if (terme.length < 2) {
    box.style.display = 'block';
    box.innerHTML = '<div class="card"><div class="result-msg">Tape au moins 2 caractères</div></div>';
    return;
  }

  box.style.display = 'block';
  box.innerHTML = '<div class="card"><div class="result-msg">Recherche...</div></div>';

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/confirmer_rdv_manuel`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ action: 'rechercher_client', terme })
    });
    const data = await res.json();
    derniersResultats = data.clients || [];

    if (!derniersResultats.length) {
      box.innerHTML = '<div class="card"><div class="result-msg">Aucun client trouvé</div></div>';
      return;
    }

    box.innerHTML = '<div class="card">' + derniersResultats.map((c, i) => {
      const details = [c.telephone, c.courriel, c.adresse].filter(Boolean).join(' · ');
      return `<div class="result-item" onclick="selectionnerClient(${i})">
        <div class="result-nom">${escapeHtml(c.nom || '(sans nom)')}</div>
        <div class="result-detail">${escapeHtml(details || '—')}</div>
      </div>`;
    }).join('') + '</div>';
  } catch (err) {
    box.innerHTML = '<div class="card"><div class="result-msg">Erreur de recherche — réessaie</div></div>';
  }
}

function selectionnerClient(i) {
  const c = derniersResultats[i];
  if (!c) return;
  document.getElementById('nom').value      = c.nom || '';
  document.getElementById('tel').value      = c.telephone || '';
  document.getElementById('courriel').value = c.courriel || '';
  document.getElementById('adresse').value  = c.adresse || '';

  document.getElementById('resultats-recherche').style.display = 'none';
  document.getElementById('resultats-recherche').innerHTML = '';
  document.getElementById('recherche-client').value = '';
  render();
}

async function chargerCatalogue() {
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/confirmer_rdv_manuel`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ action: 'liste_services' })
    });
    const data = await res.json();
    CATALOGUE = data.services || [];
  } catch (err) {
    CATALOGUE = [];
  }
}

function addSvc() {
  rows.push({ id: Date.now(), serviceId: "", nom: "", qty: 1, dur: "", prix: "", indeter: false });
  render();
}

function removeRow(id) {
  rows = rows.filter(r => r.id !== id);
  render();
}

function updateRow(id, field, val) {
  const r = rows.find(r => r.id === id);
  if (!r) return;
  if (field === 'service') {
    const svc = CATALOGUE.find(c => c.id === val);
    r.serviceId = val;
    r.nom       = svc ? svc.nom : "";
    if (svc) {
      r.dur  = svc.duree_min_base;
      r.prix = svc.prix_base;
    }
  }
  if (field === 'qty')     r.qty     = parseInt(val) || 1;
  if (field === 'dur')     r.dur     = val;
  if (field === 'prix')    r.prix    = val;
  if (field === 'indeter') { r.indeter = val; if (val) r.prix = ''; }
  render();
}

function durLabel(min) {
  min = parseInt(min) || 0;
  if (min === 0) return '—';
  const h = Math.floor(min/60), m = min%60;
  return h > 0 ? (m > 0 ? h+'h '+m+'min' : h+'h') : m+' min';
}

function render() {
  const list = document.getElementById('svc-list');
  list.innerHTML = '';

  rows.forEach(r => {
    const wrap = document.createElement('div');
    wrap.className = 'svc-card';

    const opts = CATALOGUE.map(c =>
      `<option value="${c.id}"${r.serviceId===c.id?' selected':''}>${c.nom}</option>`
    ).join('');

    let html = `
      <div class="svc-top">
        <select class="${r.serviceId?'':'empty'}" onchange="updateRow(${r.id},'service',this.value)">
          <option value="" disabled ${r.serviceId?'':'selected'}>Choisir un service...</option>
          ${opts}
        </select>
        <button class="rm-btn" onclick="removeRow(${r.id})" aria-label="Retirer">×</button>
      </div>`;

    html += `
      <div class="svc-bottom">
        <div class="svc-field">
          <label>Qté</label>
          <input type="number" min="1" value="${r.qty}" style="text-align:center"
            onchange="updateRow(${r.id},'qty',this.value)">
        </div>
        <div class="svc-field">
          <label>Durée (min)</label>
          <input type="number" min="0" placeholder="ex: 180" value="${r.dur}"
            onchange="updateRow(${r.id},'dur',this.value)">
        </div>
        <div class="svc-field">
          <label>Prix ($)</label>
          <input type="number" min="0" placeholder="${r.indeter?'—':'ex: 429'}"
            value="${r.indeter?'':r.prix}" ${r.indeter?'disabled':''}
            onchange="updateRow(${r.id},'prix',this.value)">
        </div>
      </div>
      <div class="indeter-row">
        <input type="checkbox" ${r.indeter?'checked':''} onchange="updateRow(${r.id},'indeter',this.checked)">
        <span>Prix à déterminer</span>
      </div>`;

    wrap.innerHTML = html;
    list.appendChild(wrap);
  });

  const totalDur = rows.reduce((s,r) => s + (parseInt(r.dur)||0)*r.qty, 0);
  let total = 0, hasIndet = false;
  rows.forEach(r => { if (r.indeter) hasIndet = true; else total += (parseFloat(r.prix)||0)*r.qty; });

  const summary = document.getElementById('summary');
  const suffix = hasIndet ? ' + ?' : '';

  if (rows.length > 0) {
    summary.style.display = 'flex';
    document.getElementById('dur-val').textContent   = durLabel(totalDur);
    document.getElementById('total-val').textContent = Math.round(total)+'$'+suffix;
  } else {
    summary.style.display = 'none';
  }
}

async function envoyer() {
  const nom      = document.getElementById('nom').value.trim();
  const tel      = document.getElementById('tel').value.trim();
  const courriel = document.getElementById('courriel').value.trim();
  const adresse  = document.getElementById('adresse').value.trim();
  const jour     = document.getElementById('sel-jour').value;
  const heure    = document.getElementById('sel-heure').value;
  const min      = document.getElementById('sel-min').value;
  const notes    = document.getElementById('notes-tech').value.trim();
  const msg      = document.getElementById('val-msg');
  const btn      = document.getElementById('send-btn');

  const servicesIncomplets = rows.some(r => !r.serviceId);
  if (!nom || !tel || !courriel || !adresse || !jour || !heure || !min || rows.length === 0 || servicesIncomplets) {
    msg.style.display = 'block';
    msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  msg.style.display = 'none';

  const svcsTexte = rows.map(r => {
    const p = r.indeter ? 'A determiner' : (parseFloat(r.prix)||0)+'$';
    return `${r.nom} x${r.qty} - ${p}`;
  }).join(' | ');

  const heureComplete = heure+':'+min+':00';

  // Payload pour le webhook Make existant — on ajoute juste "notes" (utilisé
  // nulle part avant) pour que Make puisse la mettre dans la description de
  // l'événement Google Calendar créé. Le reste est inchangé.
  const payload = {
    nom: nom,
    telephone: tel,
    courriel: courriel,
    adresse: adresse,
    date: jour,
    heure: heureComplete,
    services: svcsTexte,
    notes: notes
  };

  // Payload structuré (services par service_id officiel) pour Supabase — même
  // base de données que le site de réservation et l'app technicien.
  const payloadSupabase = {
    nom: nom,
    telephone: tel,
    courriel: courriel,
    adresse: adresse,
    date: jour,
    heure: heureComplete,
    notes_technicien: notes,
    services: rows.map(r => ({
      service_id: r.serviceId,
      quantite: r.qty,
      duree_min: parseInt(r.dur) || 0,
      prix: r.indeter ? 0 : (parseFloat(r.prix) || 0),
      indetermine: !!r.indeter
    }))
  };

  btn.textContent = 'Enregistrement...';
  btn.disabled = true;

  // 1) D'abord Supabase — c'est la source de vérité qui bloque les conflits
  // de van. Si ça échoue, on arrête tout: le rendez-vous n'est PAS confirmé.
  let resultatSupabase;
  try {
    const resSb = await fetch(`${SUPABASE_URL}/functions/v1/confirmer_rdv_manuel`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payloadSupabase)
    });
    resultatSupabase = await resSb.json();
    if (!resSb.ok || !resultatSupabase.ok) {
      throw new Error(resultatSupabase.erreur || 'Erreur Supabase');
    }
  } catch (err) {
    btn.textContent = 'Erreur (non enregistré) — réessayer';
    btn.disabled = false;
    return;
  }

  // 2) Ensuite le webhook Make existant, inchangé.
  btn.textContent = 'Envoi en cours...';
  fetch(WEBHOOK_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(r => {
    if (r.ok) {
      btn.innerHTML = resultatSupabase.avertissement
        ? '✓ Enregistré — ⚠️ van à assigner manuellement'
        : '✓ Confirmation envoyée';
      btn.style.background = resultatSupabase.avertissement ? '#fbbf24' : '#4ade80';
    } else {
      return Promise.reject();
    }
  })
  .catch(() => {
    // Le rendez-vous EST déjà enregistré dans Supabase à ce stade — seul
    // l'envoi de la confirmation Make a échoué.
    btn.textContent = 'Enregistré, mais confirmation non envoyée — réessayer';
    btn.disabled = false;
  });
}

async function init() {
  initSelects();
  await chargerCatalogue();
  addSvc();
}
init();
</script>
</body>
</html>
